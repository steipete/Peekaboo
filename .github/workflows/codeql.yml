name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 14 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: >-
    codeql:${{ github.workflow }}:${{ github.event.pull_request.head.repo.id || github.repository_id }}:${{ github.head_ref || github.ref_name }}:${{ github.base_ref || github.event.repository.default_branch }}
  cancel-in-progress: true

jobs:
  analyze-source:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  analyze-swift:
    name: Analyze Swift
    runs-on: xcode-27
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build Swift targets
        env:
          CODEQL_DERIVED_DATA: ${{ runner.temp }}/codeql-swift
        run: |
          set -euo pipefail

          python3 scripts/setup-swift-workspace.py setup

          xcodebuild \
            -workspace Apps/Peekaboo.xcworkspace \
            -scheme CodeQL \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath "$CODEQL_DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
