name: macOS 27 extracted-artifact smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extracted-artifact-smoke:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Ensure Rosetta for Intel artifact smoke
        run: |
          arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Build and launch extracted universal CLI artifact
        run: scripts/test-extracted-cli-artifact.sh
